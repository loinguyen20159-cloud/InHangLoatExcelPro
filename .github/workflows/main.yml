name: Build InHangLoatExcelPro.exe

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywin32 tkinterdnd2

      - name: Build InHangLoatExcelPro.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "InHangLoatExcelPro" --collect-all tkinterdnd2 main.py

      - name: Upload InHangLoatExcelPro.exe
        uses: actions/upload-artifact@v4
        with:
          name: InHangLoatExcelPro-Windows
          path: dist/InHangLoatExcelPro.exe
